services:
  - type: web
    name: veloxis-outreach-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: REPORT_EMAIL
        sync: false
      - key: CALLMEBOT_API_KEY
        sync: false
      - key: WHATSAPP_PHONE
        sync: false
      - key: TELEGRAM_USERNAME
        sync: false
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer

